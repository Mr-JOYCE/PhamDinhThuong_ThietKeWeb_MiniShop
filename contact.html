<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - MiniShop</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <header class="site-header">
        <h1>MiniShop</h1>
        <nav class="main-nav">
            <a href="index.html">Trang chủ</a>
            <a href="product.html">Sản phẩm</a>
            <a href="about.html">Giới thiệu</a>
            <a href="register.html">Đăng ký</a>
            <a href="cart.html">Giỏ hàng <span class="cart-count">0</span></a>
            <a href="login.html">Đăng nhập</a>
            <a href="contact.html" class="active" aria-current="page">Liên hệ</a>
        </nav>
    </header>

    <main>
        <h2>Liên hệ với MiniShop</h2>
        <form class="form" id="contact-form" method="post">
            <p>
                <label for="fullname">Họ tên</label><br>
                <input type="text" id="fullname" name="fullname" required
                    autocomplete="name">
            </p>
            <p>
                <label for="email">Email</label><br>
                <input type="email" id="email" name="email" required
                    autocomplete="email">
            </p>
            <p>
                <label for="subject">Tiêu đề</label><br>
                <input type="text" id="subject" name="subject" required>
            </p>
            <p>
                <label for="message">Nội dung</label><br>
                <textarea id="message" name="message" rows="6" cols="40" required></textarea>
                <span class="error" id="message-error" aria-live="polite"></span>
            </p>
            <p><button type="submit" class="btn">Gửi</button></p>
        </form>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 MiniShop. Dự án thực hành lập trình web.</p>
    </footer>
</body>
</html>
