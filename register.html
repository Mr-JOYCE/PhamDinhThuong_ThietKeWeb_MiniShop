<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Đăng ký - MiniShop</title>
        <link rel="stylesheet" href="css/style.css">
        <script src="js/main.js" defer></script>
    </head>

    <body>
        <header class="site-header">
            <h1>MiniShop</h1>
            <nav class="main-nav">
                <a href="index.html">Trang chủ</a>
                <a href="product.html">Sản phẩm</a>
                <a href="about.html">Giới thiệu</a>
                <a href="register.html" class="active" aria-current="page">Đăng ký</a>
                <a href="cart.html">Giỏ hàng <span class="cart-count">0</span></a>
                <a href="login.html">Đăng nhập</a>
                <a href="contact.html">Liên hệ</a>
            </nav>
        </header>

        <main>
            <h2>Đăng ký tài khoản</h2>

            <form action="register.html" method="get" class="form" id="register-form">
                <p>
                    <label for="fullname">Họ và tên</label><br>
                    <input type="text" id="fullname" name="fullname"
                        required minlength="3" maxlength="100" placeholder="Nhuyễn văn An">
                </p>

                <p>
                    <label for="email">Email</label><br>
                    <input type="email" id="email" name="email"
                        required placeholder="example@email.com">
                </p>

                <p>
                    <label for="password">Mật khẩu</label><br>
                    <input type="password" id="password" name="password"
                        required minlength="6">
                </p>

                <p>
                    <label for="confirm-password">Nhập lại mật khẩu</label><br>
                    <input type="password" id="confirm-password" name="confirm-password"
                        required minlength="6">
                    <span class="error" id="password-error"></span>
                </p>

                <p>
                    <label for="phone">Số điện thoại</label><br>
                    <input type="tel" id="phone" name="phone"
                        required pattern="0[0-9]{9}" placeholder="0900000000"
                        title="Số điện thoại phải bắt đầu bằng số 0 và có 10 chữ số">
                </p>

                <p>
                    Giới tính:<br>
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Nam</label><br>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Nữ</label>
                </p>

                <p>
                    <label for="province">Tỉnh/Thành phố</label><br>
                    <select id="province" name="province">
                        <option value="">--Chọn tỉnh/thành phố--</option>
                        <option value="hcm">TP. Hồ Chí Minh</option>
                        <option value="hn">Hà Nội</option>
                        <option value="dn">Đà Nẵng</option>
                    </select>
                </p>

                <p>
                    <label for="address">Địa chỉ</label><br>
                    <textarea id="address" name="address" rows="3" cols="40"></textarea>
                </p>

                <p>
                    <input type="checkbox" id="agree" name="agree" value="1" required>
                    <label for="agree">Tôi đồng ý với các điều khoản</label>
                </p>

                <p>
                    <button type="submit" class="btn">Đăng ký</button>
                </p>
            </form>
        </main>
        <footer class="site-footer">
            <p>&copy; 2026 MiniShop. Dự án thực hành lập trình web.</p>
        </footer>
    </body>
</html>
